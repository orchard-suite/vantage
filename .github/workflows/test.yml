name: Test

on:
  pull_request:
  # The release calls this first, so a push to main runs it once.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The full check: typecheck, tests (the hub's on PGlite, so no database
      # service), and the file-size gate.
      - run: make check
