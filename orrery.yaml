# What this repository builds, for the estates that read it. Muster, the
# forge reader, reads this file and writes the service, the APIs it provides,
# and the APIs it calls into the Orrery of each estate that reads this
# repository, so every estate knows the same facts. `fields` and `relations`
# place it in an estate's platform pillars (plat_pillar); an API key is the
# providing service's key and its id.
service: github/orchard-suite/vantage/packages/server
icon:
  name: vantage
  file: logo.svg
fields:
  category: Diagrams
relations:
  pillars:
  - platform/catalog
  - platform/agents
  - platform/interfaces
consumes:
- github/orchard-suite/orrery/catalog
