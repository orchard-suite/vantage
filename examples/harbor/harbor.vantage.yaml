  - id: cutover
    kind: sequence
    title: Cutover Night
    group: Processes
    question: What happens, in order, on the night the storefront moves?
    participants: [platform-lead, legacy-web, legacy-sql, prod-sql, dns-zone, front-door, prod-web]
    steps:
      - from: platform-lead
        to: legacy-web
        label: put up the maintenance page
      - from: platform-lead
        to: legacy-sql
        label: take the final backup
        reply: harbor-final.bak
      - from: platform-lead
        to: prod-sql
        label: restore harbor-final.bak
        reply: restore complete
      - from: platform-lead
        to: prod-web
        label: run smoke tests
        steps:
          - from: prod-web
            to: prod-sql
            label: read a known order
            reply: order found
        reply: 24 of 24 passed
      - alt: smoke tests pass
        steps:
          - from: platform-lead
            to: dns-zone
            label: point www at Front Door
          - from: dns-zone
            to: front-door
            label: CNAME harbor-prod.z01.azurefd.net
            kind: async
        else:
          - from: platform-lead
            to: legacy-web
            label: take down the maintenance page
      - note: TTL was lowered to 300 seconds a week before, so the swap takes minutes.
        over: [dns-zone, front-door]

