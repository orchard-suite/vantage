apiVersion: v1
kind: Service
metadata:
  name: {{ include "vantage.fullname" . }}
  labels:
    {{- include "vantage.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "vantage.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
