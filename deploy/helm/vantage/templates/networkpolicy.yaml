{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Web pods take traffic only from the ingress controller; every pod reaches
# DNS, the database, and the listed addresses (sources, sign-in, telemetry).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vantage.fullname" . }}
  labels:
    {{- include "vantage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vantage
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingressNamespace is required" $np.ingressNamespace }}
      ports:
        - { port: 4848, protocol: TCP }
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if eq .Values.database.mode "cnpg" }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ include "vantage.dbCluster" . }}
      ports:
        - { port: 5432, protocol: TCP }
    {{- end }}
    - to:
        {{- range $np.egressCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
{{- end }}
