{{- if and (not .Values.secrets.existingSecret) .Values.secrets.generate }}
{{- $name := include "vantage.secretName" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "vantage.labels" . | nindent 4 }}
  annotations:
    # Made once; an upgrade or an uninstall never replaces the keys that seal stored secrets.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $old }}
  SESSION_SECRET: {{ index $old.data "SESSION_SECRET" }}
  SECRETS_KEY: {{ index $old.data "SECRETS_KEY" }}
  {{- else }}
  SESSION_SECRET: {{ randAlphaNum 48 | b64enc }}
  SECRETS_KEY: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
